services:
  - type: web
    name: market-risk-wave-analyzer
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: FINNHUB_KEY
        sync: false
